# swarm-team.yaml — agy parallel team roster
# Agy reads this at run start. Agy still DECIDES assignment per brief.
# This file sets the roster, caps, and routing defaults.
#
# IMPORTANT: every worker is a goose invocation. IDs minimax-a / minimax-b are
# task-shapes (prose / long-context) routed onto goose, not a second binary.

coordinator:
  agent: agy
  cli: agy
  mode: coordinator-only

architect:
  agent: claude
  goals_per_run: 1
  dispatches_agy: once_per_goal
  verification:
    owner: claude
    dispatcher: claude
    worker: goose-verify
    input: raw-worker-outputs-only
    reads_raw_report_before_reply: true

workers:
  max_concurrent: 5
  pool:
    - id: goose-a
      kind: goose
      runtime: goose
      strengths: [write-code, edit-files, run-tests, shell, repo-ops]
    - id: goose-b
      kind: goose
      runtime: goose
      strengths: [write-code, edit-files, run-tests, shell, repo-ops]
    - id: goose-verify
      kind: goose
      runtime: goose
      strengths: [read-only-checks, evidence-collection]
      reserved_for: verification
    - id: minimax-a
      kind: goose
      runtime: goose
      task_shape: prose
      strengths: [drafting, summarize-long-context, research-synthesis, review-prose]
    - id: minimax-b
      kind: goose
      runtime: goose
      task_shape: prose
      strengths: [drafting, summarize-long-context, research-synthesis, review-prose]

routing:
  code_and_execution: goose
  prose_and_long_context: minimax
  mixed: goose
  verification: goose-verify
  note: >
    prose_and_long_context still launches goose. The minimax-* id only selects
    the brief shape and model instructions, not a different executable.

retry_policy:
  max_retries_per_brief: 2
  retry2_switches_class: true
  never_weaken_done_criteria: true
  after_exhaustion: BLOCKED
  quota_exhausted_shortcircuit: true
  assumption_invalid_shortcircuit: true

consolidation:
  single_report: true
  include: [goal, brief_ledger, deliverables, conflicts, retry_ledger, artifacts]
  verdict_by_agy: forbidden

runs_dir: .runs
